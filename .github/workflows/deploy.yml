name: Deploy existing Workers
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Existing Worker(s) to release
        required: true
        type: choice
        options: [web, api, bot, all]
      dry_run:
        description: Validate targets and build/test only (no deployment)
        required: true
        type: boolean
        default: true
permissions:
  contents: read
# One lock across all targets preserves API -> Bot ordering. Pending runs may be
# replaced; per-Worker revision comparisons recover their missed changes.
concurrency:
  group: cloudflare-existing-workers
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.environment.outputs.ready }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Report push impact (not the final cumulative release plan)
        if: github.event_name == 'push'
        run: node scripts/ci/changes.mjs
      - name: Report automatic deployment gate
        env:
          ENABLED: ${{ vars.ENABLE_AUTO_DEPLOY }}
        run: |
          if [[ "$ENABLED" != 'true' ]]; then
            echo 'Automatic CD is OFF. No Cloudflare writes on pushes.'
          fi
      - name: Require an operator-created environment
        id: environment
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'workflow_dispatch' ||
          vars.ENABLE_AUTO_DEPLOY == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ENV: ${{ vars.CLOUDFLARE_ENVIRONMENT }}
        run: |
          [[ "$RELEASE_ENV" =~ ^[a-zA-Z0-9_-]+$ ]] || {
            echo 'CLOUDFLARE_ENVIRONMENT must name an existing environment'
            exit 1
          }
          gh api "repos/$GH_REPO/environments/$RELEASE_ENV" > /dev/null
          echo 'ready=true' >> "$GITHUB_OUTPUT"
  release:
    runs-on: ubuntu-latest
    needs: plan
    if: >-
      github.ref == 'refs/heads/main' && needs.plan.outputs.ready == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      vars.ENABLE_AUTO_DEPLOY == 'true')
    environment: ${{ vars.CLOUDFLARE_ENVIRONMENT }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Offline guard regression tests
        run: pnpm test:deployment
      - name: Validate, release and verify selected existing Workers
        run: node scripts/ci/release.mjs
        env:
          ENABLE_AUTO_DEPLOY: ${{ vars.ENABLE_AUTO_DEPLOY }}
          DEPLOY_TARGET: ${{ inputs.target }}
          DRY_RUN: ${{ toJSON(inputs.dry_run) }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WEB_URL: ${{ vars.WEB_URL }}
          API_URL: ${{ vars.API_URL }}
          BOT_URL: ${{ vars.BOT_URL }}
